<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>RDM — Remote Download Manager</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RDM" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Dell 1996 catalog design (getdesign.md) — light-only, black page frame.
      (function () {
        try {
          document.documentElement.dataset.design = 'dell-1996';
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
